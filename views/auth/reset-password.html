<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Nação Animal | Redefinir senha</title>
    <link rel="icon" href="/images/logo/nacao-animal-logo-transparent.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/layout/public-header.css?v=20260811-1">
    <link rel="stylesheet" href="/css/pages/public-login.css?v=20260804-1">
    <link rel="stylesheet" href="/css/layout/cart-sidebar.css?v=20261001">
<link rel="stylesheet" href="/css/layout/notifications.css?v=20261021-1">
    <link rel="stylesheet" href="/css/layout/copyright.css">
    <link rel="stylesheet" href="/css/layout/storefront-theme.css?v=20261021-1">
    <link rel="stylesheet" href="/css/pages/auth-storefront.css?v=20261021-1">
    <link rel="stylesheet" href="/css/layout/customer-logout-dialog.css?v=20261021-1">
    <script src="/js/customer-session.js?v=20261025-1"></script>
</head>
<body class="storefront-page auth-storefront auth-reset">
    <nav class="storefront-container storefront-breadcrumbs" aria-label="Caminho da página"><ol><li><a href="/">Início</a></li><li><a href="/login">Entrar</a></li><li aria-current="page">Redefinir senha</li></ol></nav>
    <main class="login-container">
        <section class="login-card" aria-labelledby="resetTitle">
            <header class="login-header">
                <a class="login-logo" href="/" aria-label="Voltar para a página inicial">
                    <img src="/images/logo/nacao-animal-logo-transparent.png" alt="Logo da Nação Animal" width="88" height="88">
                </a>
                <span class="login-eyebrow">Área do cliente</span>
                <h1 id="resetTitle">Crie uma nova senha</h1>
                <p>Informe uma nova senha para voltar a acessar sua conta na Nação Animal.</p>
            </header>

            <form id="publicResetPasswordForm" class="login-form" autocomplete="off">
                <input type="hidden" id="resetToken" name="token">
                <div class="form-group">
                    <label for="resetSenha">Nova senha</label>
                    <input class="form-control" type="password" id="resetSenha" name="senha" minlength="8" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label for="resetSenhaConfirmacao">Confirmar senha</label>
                    <input class="form-control" type="password" id="resetSenhaConfirmacao" name="senhaConfirmacao" minlength="8" maxlength="50" required>
                </div>
                <button class="btn btn-primary" type="submit">
                    Salvar nova senha
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="login-note" id="resetStatus"></p>
            </form>
        </section>
    </main>
    <footer class="storefront-footer"><div class="storefront-container"><div class="storefront-footer-top"><a class="storefront-footer-brand" href="/">Nação Animal</a><nav aria-label="Links do rodapé"><a href="/login">Entrar na conta</a><a href="/#localizacao">Contato</a></nav></div><div class="storefront-footer-bottom"><p>© 2026 Nação Animal. Todos os direitos reservados.</p><nav aria-label="Informações legais"><a href="/politica-de-privacidade">Privacidade</a><a href="/termos-de-uso">Termos de uso</a></nav></div></div></footer>

    <script src="/js/layout/customer-logout-dialog.js?v=20261021-1"></script>
    <script src="/js/layout/public-header.js?v=20261025-1"></script>
    <script src="/js/pages/auth/public-auth.js?v=20261025-1"></script>
    <script src="/js/layout/cart-sidebar.js?v=20261021-1"></script>
<script src="/js/layout/notifications.js?v=20261025-1"></script>
</body>
</html>
