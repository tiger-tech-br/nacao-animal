<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalhes do produto PetFlow.">
    <title>PetFlow | Produto</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/layout/public-header.css?v=20260811-1">
    <link rel="stylesheet" href="/css/pages/public-product.css">
    <link rel="stylesheet" href="/css/layout/cart-sidebar.css?v=20261001">
<link rel="stylesheet" href="/css/layout/notifications.css?v=20261002">
</head>
<body>
    <header class="product-topbar">
        <a class="brand" href="/" aria-label="Voltar para a PetFlow">
            <img src="/images/logo/fred-petflow-logo-transparent.png" alt="Logo PetFlow">
            <strong>PetFlow</strong>
        </a>
        <nav aria-label="Navegação">
            <a href="/#products">Produtos</a>
            <a href="/#categories">Categorias</a>
            <a href="/sacola">Sacola</a>
            <a href="/login">Entrar</a>
        </nav>
    </header>

    <main class="product-page">
        <section class="product-detail" aria-labelledby="productTitle">
            <div class="product-media">
                <img id="productImage" src="/images/products/petflow-prime-racao.jpg" alt="Produto PetFlow" loading="eager">
            </div>

            <article class="product-info">
                <span class="eyebrow" id="productCategory">PetFlow</span>
                <h1 id="productTitle">Carregando produto...</h1>
                <p id="productDescription">Buscando informações do produto.</p>

                <dl class="product-specs">
                    <div>
                        <dt>SKU</dt>
                        <dd id="productSku">-</dd>
                    </div>
                    <div>
                        <dt>Disponibilidade</dt>
                        <dd id="productAvailability">Consultando estoque</dd>
                    </div>
                </dl>

                <div class="purchase-panel">
                    <strong id="productPrice">R$ 0,00</strong>
                    <button class="btn btn-primary" id="addProductToCart" type="button">
                        <i class="fa-solid fa-plus"></i>
                        Adicionar à sacola
                    </button>
                    <p id="productStatus" class="status"></p>
                </div>
            </article>
        </section>
    </main>

    <script src="/js/layout/public-header.js?v=20261012-1"></script>
    <script src="/js/pages/products/product-detail.js?v=20260928-1"></script>
    <script src="/js/layout/cart-sidebar.js?v=20261001"></script>
<script src="/js/layout/notifications.js?v=20261002"></script>
</body>
</html>
