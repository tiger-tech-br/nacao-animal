name: Verificação do PetFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: petflow_v2
      DB_EXPECTED_NAME: petflow_v2
      DB_USER: postgres
      DB_PASSWORD: ci-only-database-password
      JWT_SECRET: ci-only-secret-not-for-use-in-production
      JWT_EXPIRES_IN: 1h
      APP_URL: http://localhost:4501
      FRONTEND_URL: http://localhost:4501
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: petflow_v2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:links
      - run: npm audit --omit=dev --audit-level=high
