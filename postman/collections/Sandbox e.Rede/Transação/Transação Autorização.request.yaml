$kind: http-request
description: |-
  ### Transação de Autorização

  > Para autenticar na API, utilize os dados de PV e Token gerados na criação do projeto na área logada do [Portal do Desenvolvedor](https://developer.userede.com.br/login). 
    

  #### Autenticação

  É possível configurar a autenticação no Postman de 2 maneiras:

  - **Opção 1:** Na aba `Authorization`, selecione o tipo "Basic Auth" e preencha os campos de Username e Password com PV e Token, respectivamente. **Este é o modo que está configurado na requisição.**
      
  - **Opção 2:** Adicione na aba `Headers` da requisição o campo **Authorization** com o hash do PV e Token.  
      Exemplo para gerar o hash do token na aba `Pre-request Script`:
      
      ```
      var authBasicHash = btoa(pm.environment.get("pv") + ":" + pm.environment.get("token"));
      pm.environment.set("hash_token", "Basic " + authBasicHash);
      
       ```
      

  #### Serviço

  Cadastro da transação e-commerce. Está configurado no request uma transação de [<b>Autorização</b>](https://developer.userede.com.br/e-rede#captura)**.**

  A variável de ambiente {reference} no body da requisição está sendo preenchida na aba `Pre-request Script` com valor randômico utilizando data. Ademais, a variável da coleção {autorizacao_amount} contém o valor da requisição.

  Além disso, na aba `Tests` está sendo feita a validação do status code da requisição realizada com sucesso e está sendo armazenado o valor do tid da resposta na váriavel {autorizacao_tid}.

  [Clique aqui](https://developer.userede.com.br/e-rede#swagger_operations-Transa%C3%A7%C3%A3o-realizarTransacao) para acessar a documentação completa que apresenta os demais tipos de transação.
url: "{{base_url}}/v1/transactions"
method: POST
body:
  type: json
  content: |-
    {
        "capture": false,
        "kind": "credit",
        "reference": "{{reference}}",
        "amount": {{autorizacao_amount}},
        "installments": 2,
        "cardholderName": "John Snow",
        "cardNumber": "5448280000000007",
        "expirationMonth": 1,
        "expirationYear": 2028,
        "securityCode": "123",
        "softDescriptor": "string",
        "subscription": false,
        "origin": 1,
        "distributorAffiliation": 0,
        "brandTid": "string",
        "storageCard": "0",
        "transactionCredentials": {
            "credentialId": "01"
        }
    }
auth:
  type: basic
  credentials:
    username: "{{pv}}"
    password: "{{token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Gerando valor randômico com data para a variável de ambiente {{reference}}
      var moment = require('moment');
      var reference = "g" + moment().format("DDMMYYHHmmssSSS");
      pm.collectionVariables.set("reference", reference);
      pm.environment.set("reference", reference);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Validando status code para uma transação aprovada
      pm.test("Validação do status code", function () {
          pm.response.to.have.status(200);
      });

      // Se apresentar o campo tid na resposta, o mesmo será armazenado na variável de ambiente {{tid}}
      var response = JSON.parse(responseBody);
      if (response.tid !== undefined){
          pm.environment.set("autorizacao_tid", response.tid);
          pm.collectionVariables.set("tid", response.tid);
          pm.collectionVariables.set("autorizacao_tid", response.tid);
      }
    language: text/javascript
order: 1000
