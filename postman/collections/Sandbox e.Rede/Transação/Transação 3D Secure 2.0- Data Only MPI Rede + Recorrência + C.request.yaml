    	"kind": "credit",
    	"reference": "pedido123",
    	"amount": 2000, 
    	"cardHolderName": "John Snow",
    	"cardNumber": "2223000250000004",
    	"expirationMonth": 1,
    	"expirationYear": 2035,
    	"softDescriptor": "LOJADOZE",
    	"subscription": "true",
    	"brandTid": "012345678912345000010",
    	"storageCard": "2",
    	"transactionCredentials": {
    		"credentialId": "01"
    	},
    	"threeDSecure": {
    		"embedded": true,
    		"onFailure": "continue",
    		"userAgent": "Mozilla/5.0 (iPad; U; CPU OS 3_2_1 like Mac OS X; en-us) AppleWebKit/531.21.10 (KHTML, like Gecko) Mobile/7B405",
    		"ipAddress": "192.168.130.20",   
    	"device": {
    		"colorDepth": 1,
    		"deviceType3ds": "BROWSER",
    		"javaEnabled": false,
    		"language": "BR",
    		"screenHeight": 500,
    		"screenWidth": 500,
    		"timeZoneOffset": 3
    	},
    		"billing": {
    		"address": "Rua Pedro Luiz",
    		"city": "Guarulhos",
    		"state": "SP",
    		"country": "Brasil",
    		"postalCode": "07151-385",
    		"emailAddress": "email@user.com",
    		"phoneNumber": "(11)91234-5678"
    	},
    		"challengePreference": "DATA_ONLY"
    	},
    	"urls": [
    		{
    			"kind": "threeDSecureSuccess",
    			"url": "https://scommerce.userede.com.br/LojaTeste/Venda/sucesso"
    		},
    		{
    			"kind": "threeDSecureFailure",
    			"url": "https://scommerce.userede.com.br/LojaTeste/Venda/erro"
    		}
    	]
    }
auth:
  type: basic
  credentials:
    username: "{{pv}}"
    password: "{{token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Gerando valor randômico com data para a variável de ambiente {{reference}}
      var moment = require('moment');
      var reference = "g" + moment().format("DDMMYYHHmmssSSS");
      pm.collectionVariables.set("reference", reference);
      pm.environment.set("reference", reference);
    language: text/javascript
  - type: afterResponse
    code: |-
      // Validando status code para uma transação aprovada
      pm.test("Validação do status code", function () {
        pm.response.to.have.status(200);
      });

      // Se apresentar o campo tid na resposta, o mesmo será armazenado na variável de ambiente {{tid}}
      var response = JSON.parse(responseBody);
      if (response.tid !== undefined){
        pm.environment.set("tid", response.tid);
      }
    language: text/javascript
order: 9000
