$kind: http-request
url: "{{urlToken}}/token-service/v2/tokenization/{{tokenizationId}}"
method: PUT
body:
  type: json
  content: "{\r

    \t\"tokenizationStatus\": \"resume\",\r

    \t\"reason\": 1\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: "var url = pm.variables.get(\"urlToken\");\r

      \r

      var hashToken = \"\";\r

      \r

      if (pm.environment.get(\"ClientId\") == undefined) {\r

      \  hashToken = btoa(\r

      \    pm.collectionVariables.get(\"ClientId\") + \":\" + pm.collectionVariables.get(\"ClientSecret\")\r

      \  );\r

      } else {\r

      \  hashToken = btoa(\r

      \    pm.environment.get(\"ClientId\") + \":\" + pm.environment.get(\"ClientSecret\")\r

      \  );\r

      }\r

      \r

      const createOptions = {\r

      \  url: `${url}/token-service/oauth/v2/tokenization/`,\r

      \  method: \"POST\",\r

      \  header: {\r

      \    \"Content-Type\": \"application/json\",\r

      \    Authorization: 'Bearer ' + pm.variables.get('access_token')\r

      \  }, \r

      \  body: {\r

      \    mode: \"raw\",\r

      \    raw: JSON.stringify({\r

      \      email: \"john_snow@gmail.com\",\r

      \      cardNumber: \"0000000000000008\",\r

      \      expirationMonth: `${pm.variables.get(\"current_month\")}`,\r

      \      expirationYear: `${pm.variables.get(\"current_year\")}`,\r

      \      securityCode: \"235\",\r

      \      storageCard: 2,\r

      \    }),\r

      \  },\r

      };\r

      \r

      pm.sendRequest(createOptions, function (err, res) {\r

      \  if (res.code == 201) {\r

      \    console.log(res.json().tokenizationId);\r

      \    const tokenizationId = res.json().tokenizationId;\r

      \    pm.variables.set(\"tokenizationId\", tokenizationId);\r

      \r

      \    const callbackOptions = {\r

      \      url: `${url}/token-service/v2/tokenization/callback/${pm.variables.get(\r

      \        \"tokenizationId\"\r

      \      )}`,\r

      \      method: \"PUT\",\r

      \      header: {\r

      \        \"Content-Type\": \"application/json\",\r

      \      },\r

      \    };\r

      \r

      \    pm.sendRequest(callbackOptions, function (err, resp) {\r

      \      if (resp.code == 201) {\r

      \        console.log(res.json().tokenizationId);\r

      \        const tokenizationId = res.json().tokenizationId;\r

      \        pm.variables.set(\"tokenizationId\", tokenizationId);\r

      \        console.log(\"Callback done\");\r

      \      }\r

      \    });\r

      \  }\r

      });\r\n"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"returnCode equal to '00'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnCode).to.eql(\"00\");\r

      });\r

      \r

      pm.test(\"returnMessage equal to 'Success'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnMessage).to.eql(\"Success\");\r

      });\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });"
    language: text/javascript
order: 5000
