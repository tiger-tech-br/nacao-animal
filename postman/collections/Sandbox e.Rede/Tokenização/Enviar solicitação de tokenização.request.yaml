$kind: http-request
url: "{{urlToken}}/token-service/v2/tokenization/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"john_snow@gmail.com\",\r

    \  \"cardNumber\": \"4895370010000005\",\r

    \  \"kind\": \"credit\",\r

    \  \"expirationMonth\": \"{{current_month}}\",\r

    \  \"expirationYear\": \"{{current_year}}\",\r

    \  \"cardholderName\": \"John Snow\",\r

    \  \"securityCode\": \"235\",\r

    \  \"storageCard\": 0,\r

    \  \"embeddedZeroDollar\": \"true\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"returnCode equal to '00'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnCode).to.eql(\"00\");\r

      });\r

      \r

      pm.test(\"returnMessage equal to 'Success'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnMessage).to.eql(\"Success\");\r

      });\r

      \r

      pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"tokenizatioId was returned\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect('tokenizationId' in jsonData);\r

      });"
    language: text/javascript
order: 7000
