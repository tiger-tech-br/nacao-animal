$kind: http-request
url: "{{urlToken}}/token-service/v2/tokenization/12312"
method: GET
auth:
  type: basic
  credentials:
    username: "{{pv}}"
    password: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"returnCode equal to '02'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnCode).to.eql(\"02\");\r

      });\r

      \r

      pm.test(\"returnMessage equal to 'TokenizationId: Invalid guid value.'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnMessage).to.eql(\"TokenizationId: Invalid guid value.\");\r

      });\r

      \r

      pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
order: 2000
