$kind: http-request
url: "{{urlToken}}/token-service/v2/tokenization/"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"john_snow@dominio.com.br\",\r

    \    \"cardNumber\": \"4895370010000005\",\r

    \    \"expirationMonth\": \"{{current_month}}\",\r

    \    \"expirationYear\": \"{{current_year}}\",\r

    \    \"securityCode\": \"0\",\r

    \    \"storageCard\": 2\r

    }"
auth:
  type: basic
  credentials:
    username: "{{pv}}"
    password: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"returnCode equal to '19'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnCode).to.eql(\"19\");\r

      });\r

      \r

      pm.test(\"returnMessage equal to 'SecurityCode: Invalid parameter size'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnMessage).to.eql(\"SecurityCode: Required parameter missing\");\r

      });\r

      \r

      pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
order: 18000
