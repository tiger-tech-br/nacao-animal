$kind: http-request
url: "{{urlToken}}/token-service/v2/tokenization/"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"john_snow@dominio.com.br\",\r

    \    \"cardNumber\": \"123456789#######\",\r

    \    \"expirationMonth\": \"{{current_month}}\",\r

    \    \"expirationYear\": \"{{current_year}}\",\r

    \    \"storageCard\": 2\r

    }"
auth:
  type: basic
  credentials:
    username: "{{pv}}"
    password: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"returnCode equal to '09'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnCode).to.eql(\"09\");\r

      });\r

      \r

      pm.test(\"returnMessage equal to 'CardNumber: Invalid parameter format'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.returnMessage).to.eql(\"CardNumber: Invalid parameter format\");\r

      });\r

      \r

      pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
order: 9000
