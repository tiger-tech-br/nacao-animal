method: POST
body:
  type: json
  content: "{\r

    \    \"authorization\": {\r

    \        \"type\": \"basic\",\r

    \        \"token\": \"Basic aFGEfgsASDFeuAAhaoe=\"\r

    \    }\r

    }"
